<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Non-Metal Elements</title>

    <link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin>
    <link rel="preconnect" href="https://pyscript.net" crossorigin>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://pyscript.net/releases/2024.11.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.11.1/core.js"></script>

    <style>
        @import url('https://fonts.cdnfonts.com/css/spongeboy-me-bob');

        :root {
            --bg-sage: #A9CBBF;
            --card-cream: #FDF7CE;
            --header-periwinkle: #8296CC;
            --header-text: #D3EEE7;
            --box-aqua: #CDEAE5;
            --input-cream: #FDF7CE;
            --border-periwinkle: #8296CC;
            --text-slate: #4F638F;
            --text-periwinkle: #7B8EC2;
            --divider-tan: #C8C4A6;
        }

        * {
            font-family: 'Spongeboy Me Bob', sans-serif;
            letter-spacing: 0.03em;
        }

        body {
            background-color: var(--bg-sage);
            font-family: 'Spongeboy Me Bob', sans-serif;
            min-height: 100vh;
            margin: 0;
        }

        .display-font {
            font-family: 'Spongeboy Me Bob', sans-serif;
            letter-spacing: 0.04em;
        }

        .main-card {
            background-color: var(--card-cream);
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(45, 65, 60, 0.12);
            overflow: hidden;
        }

        .card-header {
            background-color: var(--header-periwinkle);
            color: var(--header-text);
        }

        .instructions-box {
            background-color: var(--box-aqua);
            border: 1.5px solid var(--border-periwinkle);
            border-radius: 6px;
        }

        .custom-input {
            background-color: var(--input-cream);
            border: 1.5px solid var(--border-periwinkle);
            border-radius: 6px;
            color: var(--text-slate);
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .custom-input:focus {
            outline: none;
            border-color: var(--text-slate);
            box-shadow: 0 0 0 3px rgba(131, 150, 202, 0.28);
        }

        .check-btn {
            background-color: var(--box-aqua);
            color: var(--text-slate);
            border-radius: 6px;
            transition: transform 0.12s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        }

        .check-btn:hover {
            background-color: #bee0da;
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(79, 99, 143, 0.15);
        }

        .check-btn:active {
            transform: translateY(1px);
        }

        .divider-line {
            border: 0;
            height: 2px;
            background-color: var(--divider-tan);
        }

        .result-box {
            background-color: var(--input-cream);
            border: 1.5px solid var(--border-periwinkle);
            border-radius: 6px;
            color: var(--text-slate);
        }

        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .reveal-result {
            animation: fadeSlideIn 0.25s ease forwards;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 sm:p-8">

    <main class="main-card w-full max-w-[660px] my-6">
        
        <header class="card-header py-5 px-4 text-center">
            <h1 class="display-font text-3xl sm:text-5xl font-normal select-none leading-tight">
                Non-Metal Elements
            </h1>
        </header>

        <div class="p-5 sm:p-7">
            
            <section class="instructions-box px-4 py-3 mb-6">
                <p class="display-font text-base sm:text-xl leading-snug">
                    <span style="color: var(--text-slate);">instructions:</span>
                    <span style="color: var(--text-periwinkle);">
                        Enter the symbol of a non-metal element (Example: H, O, Cl, Ne, Xe).
                    </span>
                </p>
            </section>

            <div class="mb-5">
                <label for="element_input" class="display-font block text-lg sm:text-xl mb-1.5" style="color: var(--text-slate);">
                    Element Symbol
                </label>
                <input
                    type="text"
                    id="element_input"
                    maxlength="4"
                    autocomplete="off"
                    placeholder="e.g. O, Cl, Ne..."
                    class="custom-input w-full px-3.5 py-2.5 text-lg"
                />
            </div>

            <div class="flex flex-col items-center my-6">
                <button
                    id="check_btn"
                    type="button"
                    class="check-btn display-font px-12 sm:px-20 py-3 text-xl sm:text-2xl cursor-pointer select-none"
                >
                    Check Details
                </button>
        
            </div>

            <hr class="divider-line w-11/12 mx-auto my-6" />

            <section id="result_section" style="display: none;" class="reveal-result">
                <h2 class="display-font text-lg sm:text-xl mb-1.5" style="color: var(--text-slate);">
                    Result
                </h2>
                <div id="result" class="result-box p-4 sm:p-5 display-font text-base sm:text-lg leading-relaxed">
                </div>
            </section>

        </div>
    </main>

    <script type="mpy" src="skillstest.py"></script>

</body>
</html>
